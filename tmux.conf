set -ga terminal-overrides ",xterm-256color*:Tc"
set-option -g default-terminal "tmux-256color"
set -s escape-time 0
set-option -g focus-events on
set -g mouse on
set -g extended-keys on

set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

bind-key -T copy-mode-vi WheelUpPane send-keys -X scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X scroll-down

unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# STATUS BAR SETUP
# set-option -g status on
# set-option -g status-style fg="white",bg="black"
set-option -g status-justify absolute-centre
# set-option -g status-left "#H"
# set -g status-right "#{client_session}"

# Last-resort fallbacks for every #{@...} used below, in case the generator on
# the next line is missing (fresh machine, dotfiles not linked yet). Without
# them the unset ones expand to an empty string and silently do nothing.
# Values mirror matte-black's colors.toml.
set -g @background "#121212"
set -g @foreground "#bebebe"
set -g @dark_foreground "#555555"
set -g @green "#FFC107"
set -g @blue "#e68e0d"
set -g @magenta "#D35F5F"
set -g @muted "#333333"
set -g @selection "#2a2a2a"

# Stock Omarchy themes ship a colors.toml but no tmux.conf, so there's nothing
# theme-specific here to source directly. `tmux-theme generate` renders the
# current theme's colors.toml into @-options; the theme-set hook regenerates
# and re-sources this file on every `omarchy theme set`.
run-shell "$HOME/.local/share/aaron/tmux-theme generate"
source-file -q ~/.local/state/omarchy/current/theme-tmux.conf

# A theme may still ship its own tmux.conf to override the generated palette.
source-file -q ~/.local/state/omarchy/current/theme/tmux.conf

# theme
set -g status "on"
set -gF status-bg "#{@background}"
set -g status-left-length "100"
set -g status-right-length "100"
set -g status-interval 5
set -g message-style "fg=#{@green},bg=#{@background},align=centre"
set -g message-command-style "fg=#{@green},bg=#{@background},align=centre"
set -g pane-border-style "fg=#{@background}"
set -g pane-active-border-style "fg=#{@blue}"
set -g window-status-activity-style "fg=#{@foreground},bg=#{@background},none"
set -g window-status-separator ""
set -g window-status-style "fg=#{@foreground},bg=#{@background},none"
set -g window-status-current-format "#[fg=#{@blue},bg=#{@background}] #I:#[fg=#{@magenta},bg=#{@background}](✓) #[fg=#{@magenta},bg=#{@background}]#W #[fg=#{@magenta},bg=#{@background}]"
set -g window-status-format "#[fg=#{@foreground},bg=#{@background}] #I:#[fg=#{@foreground},bg=#{@background}]#W"
set -g status-right "#[fg=#{@blue},bg=#{@background},nobold,nounderscore,noitalics]#[fg=#{@background},bg=#{@blue},nobold,nounderscore,noitalics] #[fg=#{@foreground},bg=#{@background}] #W #{?client_prefix,#[fg=#{@magenta}],#[fg=#{@green}]}#[bg=#{@background}]#{?client_prefix,#[bg=#{@magenta}],#[bg=#{@green}]}#[fg=#{@background}] #[fg=#{@foreground},bg=#{@background}] #S "
set -g status-left "#[fg=#{@background},bg=#{@blue},bold] #{b:pane_current_path} #[fg=#{@blue},bg=#{@background},nobold]#[fg=#{@dark_foreground}] #(cd '#{pane_current_path}' && git branch --show-current 2>/dev/null) "
set -gF clock-mode-colour "#{@blue}"
# mode-style styles choose-tree/choose-window and the copy-mode position
# indicator; copy-mode-selection-style styles the actual vi selection.
set -g mode-style "fg=#{@foreground},bg=#{@muted}"
set -g copy-mode-selection-style "fg=#{@foreground},bg=#{@selection}"

set -g base-index 1

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle \; send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# next and last session
# bind-key ( switch-client -n
# bind-key ) switch-client -p
bind-key L switch-client -l

# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# new alt commands
bind -n M-k select-pane -U
bind -n M-j select-pane -D
bind -n M-h select-pane -L
bind -n M-l select-pane -R

# fullscreen pane
bind -n M-f resize-pane -Z

# change pane size
bind -n M-H resize-pane -L 2
bind -n M-J resize-pane -D 2
bind -n M-K resize-pane -U 2
bind -n M-L resize-pane -R 2

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind-key -n M-w if-shell -F '#{pane_in_mode}' \
  'send-keys q' \
  'choose-tree -swZ'

# split horizontally pane
bind s split-window
# split vertically pane
bind v split-window -h

# bind w choose-window
bind-key w choose-tree -swZ

# reload tmux
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded tmux.conf"

# resize windows
# bind -r K resize-pane -U 5
# bind -r J resize-pane -D 5
# bind -r H resize-pane -L 5
# bind -r L resize-pane -R 5

# forget the find window.  That is for chumps
bind-key -n C-f run-shell "tmux neww ~/.local/share/aaron/tmux-sessionizer"
# bind-key -r ^g run-shell "tmux neww ~/.local/bin/tmux-sessionizer -s 0"
# bind-key -r ^a run-shell "tmux neww ~/.local/bin/tmux-sessionizer -s 0 --vsplit --split-size 35"
# bind-key -n M-o run-shell -b "./opencode-sessionizer"
# bind-key -n M-o run-shell "~/.local/bin/opencode-sessionizer"
